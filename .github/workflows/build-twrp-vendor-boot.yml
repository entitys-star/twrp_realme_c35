name: Build TWRP vendor_boot (RMX3511)

on:
  workflow_dispatch:
    inputs:
      vendor_boot_url:
        description: "Direct URL to the stock RMX3511T2_13.F.73 vendor_boot.img release asset"
        required: false
        default: "https://github.com/entitys-star/twrp_realme_c35/releases/download/assets/vendor_boot.img"
        type: string

permissions:
  contents: read

# A full source build is expensive; never run multiple identical builds at once.
concurrency:
  group: twrp-rmx3511-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-android: 'true'

      - name: Cache TWRP repo metadata
        uses: actions/cache@v4
        with:
          path: twrp-source/.repo
          key: twrp-source-repo-${{ runner.os }}-twrp-12.1
          restore-keys: |
            twrp-source-repo-${{ runner.os }}-twrp-12.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl cpio flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2-utils lz4 openjdk-11-jdk pngcrush python3 python3-lz4 rsync \
            schedtool squashfs-tools unzip x11proto-core-dev xsltproc zip zlib1g-dev
          java -version
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Check out device tree and tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: device-tree-source

      - name: Download and verify stock vendor_boot
        timeout-minutes: 10
        env:
          VENDOR_BOOT_URL: ${{ inputs.vendor_boot_url || 'https://github.com/entitys-star/twrp_realme_c35/releases/download/assets/vendor_boot.img' }}
        run: |
          set -euo pipefail
          STOCK_VENDOR_BOOT="$GITHUB_WORKSPACE/vendor_boot_stock.img"
          echo "Downloading stock vendor_boot from: $VENDOR_BOOT_URL"
          echo "Workspace and temp:"
          printf 'GITHUB_WORKSPACE=%s\nRUNNER_TEMP=%s\n' "$GITHUB_WORKSPACE" "${RUNNER_TEMP:-unset}"
          df -h "$GITHUB_WORKSPACE"
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --output "$STOCK_VENDOR_BOOT" \
            --write-out 'HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            "$VENDOR_BOOT_URL"
          test -s "$STOCK_VENDOR_BOOT"
          ACTUAL_SIZE="$(stat -c '%s' "$STOCK_VENDOR_BOOT")"
          echo "Downloaded size: $ACTUAL_SIZE bytes"
          test "$ACTUAL_SIZE" -eq 104857600
          echo "Downloaded SHA-256:"
          sha256sum "$STOCK_VENDOR_BOOT"
          echo "17e5c60be1414e56fabfaf50887aa1e2dc910e8dc6516ad2182fce182762c4b1  $STOCK_VENDOR_BOOT" | sha256sum --check -
      - name: Stage stock ramdisk and DTB
        run: |
          set -euo pipefail
          # The runner's /tmp filesystem is small; put the expanded 54 MiB ramdisk
          # and its extracted files on the large workspace volume instead.
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          export TMPDIR="$GITHUB_WORKSPACE/tmp"
          echo "Disk space before ramdisk extraction:"
          df -h / /tmp "$GITHUB_WORKSPACE"
          cd device-tree-source
          python3 tools/prepare_vendor_ramdisk.py "$GITHUB_WORKSPACE/vendor_boot_stock.img"
          test -s device/realme/ums9230_nico/prebuilt/dtb.img
          test -s device/realme/ums9230_nico/recovery/root/lib/modules/modules.load.recovery
          git status --short
          echo "Disk space after ramdisk extraction:"
          df -h / /tmp "$GITHUB_WORKSPACE"

      - name: Initialize TWRP source
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp-source"
          cd "$GITHUB_WORKSPACE/twrp-source"
          echo "Disk space before TWRP sync:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo install repo /usr/local/bin/repo
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-tags --optimized-fetch --prune -j2
          echo "Disk space after TWRP sync:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Install device tree
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp-source/device/realme"
          cp -a device-tree-source/device/realme/ums9230_nico "$GITHUB_WORKSPACE/twrp-source/device/realme/ums9230_nico"
          test -s "$GITHUB_WORKSPACE/twrp-source/device/realme/ums9230_nico/prebuilt/dtb.img"
          test -s "$GITHUB_WORKSPACE/twrp-source/device/realme/ums9230_nico/recovery/root/lib/modules/modules.load.recovery"

      - name: Preserve staged vendor ramdisk files
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/twrp-source"
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("build/make/core/Makefile")
          lines = makefile.read_text().splitlines()
          matches = [
              i for i, line in enumerate(lines)
              if "rsync -a --exclude=sdcard" in line
              and "$(TARGET_ROOT_OUT)" in line
              and "$(TARGET_RECOVERY_OUT)" in line
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one recovery-root rsync command; found {len(matches)}. "
                  "Refusing to patch an unknown build tree."
              )
          i = matches[0]
          if "--exclude=vendor" not in lines[i]:
              lines[i] = lines[i].replace(
                  "rsync -a --exclude=sdcard",
                  "rsync -a --exclude=sdcard --exclude=vendor",
                  1,
              )
          makefile.write_text("\n".join(lines) + "\n")
          print("Patched recovery-root rsync to preserve the staged vendor directory.")
          PY

      - name: Build vendor_boot image
        run: |
          # Android's envsetup.sh references unset variables; nounset (-u) aborts before lunch.
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/twrp-source"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_ums9230_nico-eng
          mka vendorbootimage -j2 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect and validate build outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          test -f "$GITHUB_WORKSPACE/build.log" || touch "$GITHUB_WORKSPACE/build.log"
          OUT="$GITHUB_WORKSPACE/twrp-source/out/target/product/ums9230_nico"
          if [ -f "$OUT/vendor_boot.img" ]; then
            cp -f "$OUT/vendor_boot.img" "$GITHUB_WORKSPACE/build-output/vendor_boot_twrp_raw.img"
          fi
          df -h
          ls -lh "$GITHUB_WORKSPACE/build-output" || true
          if [ "${{ job.status }}" = "success" ]; then
            RAW_IMAGE="$GITHUB_WORKSPACE/build-output/vendor_boot_twrp_raw.img"
            test -s "$RAW_IMAGE" || { echo "::error::Build command succeeded but raw vendor_boot.img is missing."; exit 1; }
            IMAGE="$GITHUB_WORKSPACE/build-output/vendor_boot.img"
            python3 "$GITHUB_WORKSPACE/device-tree-source/tools/merge_vendor_boot_recovery.py" \
              "$GITHUB_WORKSPACE/vendor_boot_stock.img" "$RAW_IMAGE" --output "$IMAGE"
            IMAGE_SIZE="$(stat -c '%s' "$IMAGE")"
            echo "Merged vendor_boot.img size: $IMAGE_SIZE bytes"
            test "$IMAGE_SIZE" -eq 104857600 || { echo "::error::Merged vendor_boot.img must preserve the exact 100 MiB partition image size."; exit 1; }
            python3 "$GITHUB_WORKSPACE/device-tree-source/tools/audit_vendor_boot.py" \
              "$IMAGE" -o "$GITHUB_WORKSPACE/build-output/merged-image-audit"
            sha256sum "$IMAGE"
          fi
      - name: Upload build output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmx3511-twrp-vendor-boot
          path: |
            build-output/
            build.log
          if-no-files-found: warn
          retention-days: 7
