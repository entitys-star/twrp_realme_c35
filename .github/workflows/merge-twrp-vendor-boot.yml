name: Merge TWRP recovery into stock vendor_boot (RMX3511)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/merge-twrp-vendor-boot.yml'
      - 'tools/merge_vendor_boot_recovery.py'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful build run containing the raw TWRP vendor_boot artifact"
        required: false
        default: "39071283258"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out device tree and merge tools
        uses: actions/checkout@v4

      - name: Download raw TWRP build artifact
        uses: actions/download-artifact@v4
        with:
          name: rmx3511-twrp-vendor-boot
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '39071283258' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior-build

      - name: Download and verify stock vendor_boot
        env:
          VENDOR_BOOT_URL: https://github.com/entitys-star/twrp_realme_c35/releases/download/assets/vendor_boot.img
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --output vendor_boot_stock.img "$VENDOR_BOOT_URL"
          test "$(stat -c '%s' vendor_boot_stock.img)" -eq 104857600
          echo "17e5c60be1414e56fabfaf50887aa1e2dc910e8dc6516ad2182fce182762c4b1  vendor_boot_stock.img" | sha256sum --check -

      - name: Merge only the TWRP recovery fragment
        run: |
          set -euo pipefail
          RAW="prior-build/build-output/vendor_boot.img"
          test -s "$RAW" || { echo "::error::Raw vendor_boot.img was not found in the selected artifact."; find prior-build -maxdepth 3 -type f -print; exit 1; }
          mkdir -p merged-output
          python3 tools/merge_vendor_boot_recovery.py vendor_boot_stock.img "$RAW" --output merged-output/vendor_boot.img
          test "$(stat -c '%s' merged-output/vendor_boot.img)" -eq 104857600
          python3 tools/audit_vendor_boot.py merged-output/vendor_boot.img -o merged-output/audit
          sha256sum merged-output/vendor_boot.img

      - name: Upload merged flash image
        uses: actions/upload-artifact@v4
        with:
          name: rmx3511-twrp-vendor-boot-merged
          path: merged-output/
          if-no-files-found: error
          retention-days: 14
